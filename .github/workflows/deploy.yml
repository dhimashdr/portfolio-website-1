name: Deploy OpenNext to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm clean-install

      - name: Build and Deploy
        env:
          # Token agar GitHub punya akses ke Cloudflare kamu
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
          # HAPUS tanda pagar di bawah ini dan isi dengan variabel publik kamu jika ada
          NEXT_PUBLIC_SANITY_DATASET: "production"
          NEXT_PUBLIC_SANITY_PROJECT_ID: "husto4mt"
        run: npm run deploy
